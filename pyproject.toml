[project]
name = "codcode"
version = "0.1.0"
description = "Security-oriented local agent harness"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.16.1",
    "litert-lm-api>=0.12.0",
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
]

[project.scripts]
cod = "codcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codcode"]
